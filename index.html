<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Survey Form</title>
    </head>
    <body>
        <form id="surveyForm" action="https://httpbin.org/post" method="post">
            <h1>Survey Form</h1>

            <div class="input-container">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" />
            </div>

            <div class="input-container">
                <label>Favorite Genre:</label>

                <input type="radio" id="action" name="genre" value="action" />
                <label for="action">Action</label>

                <input type="radio" id="comedy" name="genre" value="comedy" />
                <label for="comedy">Comedy</label>

                <input type="radio" id="drama" name="genre" value="drama" />
                <label for="drama">Drama</label>
            </div>
            <div class="input-container">
                <label>What type of movies do you like?</label>

                <input type="checkbox" id="hollywood" name="movies" value="hollywood" />
                <label for="hollywood">Hollywood</label>

                <input type="checkbox" id="bollywood" name="movies" value="bollywood" />
                <label for="bollywood">Bollywood</label>

                <input type="checkbox" id="animated" name="movies" value="animated" />
                <label for="animated">Animated</label>
            </div>
 
            <div class="input-container">
                <label for="frequency">How often do you watch movies?</label>
                <select id="frequency" name="frequency">
                    <option value="">-- Select --</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>

            <input type="submit" value="Submit" />
        </form>

        <footer>
            <script src="script.js"></script>
        </footer>
    </body>
</html>
